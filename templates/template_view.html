{% extends "base.html" %}
{% block title %}Cold Emailing - Template{% endblock %}
{% block page_title %}Template: {{ name }}{% endblock %}
{% block content %}
<div class="card p-4">
  <pre class="text-prewrap bg-light p-3 rounded">{{ content }}</pre>
  <div class="mt-3 d-flex gap-2">
    <a href="{{ url_for('template_edit', name=name) }}" class="btn btn-primary"><i class="bi bi-pencil"></i> Edit</a>
    <a href="{{ url_for('templates_page') }}" class="btn btn-link">Back to Templates</a>
  </div>
</div>
{% endblock %}
